<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="典藏 · 图书管理系统 —— 读者、图书管理员与系统管理员三种身份的工作台">
  <title>典藏 · 图书管理系统</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <div class="app">

    <!-- 侧栏（书脊）：品牌 + 身份切换 + 工作流程 -->
    <aside class="sidebar">
      <div class="brand">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
          </svg>
        </div>
        <div>
          <h1>典藏</h1>
          <small>图书管理系统</small>
        </div>
      </div>

      <div class="side-group-title">选择身份</div>
      <div class="role-switch" id="roleSwitch"></div>

      <div class="side-divider"></div>

      <div class="side-group-title">工作流程</div>
      <nav class="flow-nav" id="flowNav" aria-label="工作流程导航"></nav>

      <div class="side-foot">
        软件设计与体系结构 · 课程实验<br>
        读者 / 图书管理员 / 系统管理员 三种身份<br>
        按业务流程顺序组织操作入口
      </div>
    </aside>

    <!-- 主栏 -->
    <div class="main-col">
      <header class="topbar">
        <div>
          <div class="t-title" id="topTitle"></div>
          <div class="t-sub" id="topSub"></div>
        </div>
        <div class="identity-bar" id="identityBar"></div>
      </header>
      <main class="content" id="content"></main>
    </div>

  </div>

  <div class="toast-root" id="toasts" aria-live="polite"></div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
